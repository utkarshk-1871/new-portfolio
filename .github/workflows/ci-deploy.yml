name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # required to delete stale github-pages artifacts on job re-runs

# Do not cancel in-progress deploy runs. Cancelling during deploy-pages leaves a
# zombie Pages deployment that blocks every subsequent deploy for ~10 minutes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # PRs: validate only — no deploy, no Pages artifacts
  quality:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm test

      - name: Build for GitHub Pages
        run: pnpm build:pages
        env:
          NEXT_PUBLIC_BASE_PATH: /new-portfolio
          NEXT_PUBLIC_SITE_URL: https://utkarshk-1871.github.io/new-portfolio

      - run: pnpm check-links
        env:
          NEXT_PUBLIC_BASE_PATH: /new-portfolio

  # main push: quality gate + deploy in a single job so re-runs don't
  # leave duplicate "github-pages" artifacts from a separate deploy job.
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm test

      - name: Build for GitHub Pages
        run: pnpm build:pages
        env:
          NEXT_PUBLIC_BASE_PATH: /new-portfolio
          NEXT_PUBLIC_SITE_URL: https://utkarshk-1871.github.io/new-portfolio

      - run: pnpm check-links
        env:
          NEXT_PUBLIC_BASE_PATH: /new-portfolio

      - uses: actions/configure-pages@v5

      # Re-running only the failed deploy step leaves a stale "github-pages"
      # artifact from the prior attempt in the same workflow run. Remove all
      # matching artifacts before uploading again.
      - name: Remove stale Pages artifacts
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name=="github-pages") | .id' \
            | while read -r id; do
              if [ -n "$id" ]; then
                gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" -X DELETE
              fi
            done
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/

      # Rapid pushes can orphan in-progress Pages deployments under a different SHA
      # than the current commit. Cancel recent main commits (safe no-op if idle).
      - name: Cancel stale in-progress Pages deployments
        continue-on-error: true
        run: |
          for sha in $(git log --format=%H -n 15); do
            gh api "repos/${GITHUB_REPOSITORY}/pages/deployments/${sha}/cancel" -X POST 2>/dev/null || true
          done
          sleep 15
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/deploy-pages@v4
        id: deployment
